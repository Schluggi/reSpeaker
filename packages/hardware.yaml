# =============================================================================
# Respeaker XVF3800 satellite — hardware package
#
# Board-fixed configuration: the I2S microphone bus and the XMOS XVF3800 DSP.
# Playback goes to a Home Assistant media player, not to a local speaker.
#
# Do not change the pins. They are fixed by the board layout.
# =============================================================================

i2s_audio:
  - id: i2s_input
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO8

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

# Room loudness from the I2S stream the wake word already keeps open.
# Channel 0 is the lr48 ASR output: beamformed, without AGC or noise
# suppression. passive keeps this sensor from starting or stopping the mic.
sensor:
  - platform: sound_level
    microphone:
      microphone: i2s_mics
      channels: 0
    passive: true
    measurement_duration: 1s
    rms:
      name: "Room Loudness"
      icon: mdi:volume-high

respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: 1s
    on_turn_on:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_on_sound"
    on_turn_off:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_off_sound"
  dfu_version:
    name: "Firmware Version"
    update_interval: 120s
  led_beam_sensor:
    name: "Voice Beam Direction"
    id: beam_direction
    internal: true
    # One non-blocking read per poll. The DSP answers CTRL_WAIT during silence;
    # the next poll is the retry, so keep this fast enough to track a speaker.
    # This poll is also the azimuth source for beam lock. Set update_interval to
    # never, and the Beam lock switch stops working.
    update_interval: 100ms
  firmware:
    url: ${respeaker_repo}/raw/${respeaker_ref}/application_xvf3800_inthost-lr48-sqr-i2c-v1.0.7-release.bin
    version: "1.0.7"
    md5: 043a848f544ff2c7265ac19685daf5de
